x-api-env: &api-env
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - set it in .env (see .env.example)}
  DEBUG: ${DEBUG:-false}
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: masterly
  DB_USER: masterly
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in .env (see .env.example)}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - set it in .env (see .env.example)}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required - set it in .env (see .env.example)}@redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required - set it in .env (see .env.example)}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required - set it in .env (see .env.example)}
  MINIO_BUCKET: masterly-documents
  MEILI_HOST: http://meilisearch:7700
  MEILI_KEY: ${MEILI_KEY:?MEILI_KEY is required - set it in .env (see .env.example)}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-masterly-air-academy.dz,www.masterly-air-academy.dz,localhost,127.0.0.1,api}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://masterly-air-academy.dz,https://www.masterly-air-academy.dz,http://localhost,http://127.0.0.1}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://masterly-air-academy.dz,https://www.masterly-air-academy.dz,http://localhost,http://127.0.0.1}
  SITE_URL: ${SITE_URL:-https://masterly-air-academy.dz}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@masterly-air-academy.dz}
  SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-${SUPERUSER_PASSWORD:-}}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@masterly-air-academy.dz}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}

services:
  nginx:
    image: nginx:1.31.2-alpine
    ports:
      - "127.0.0.1:7788:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - masterly

  api:
    build: ./backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment: *api-env
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - masterly

  celery:
    build: ./backend
    command: celery -A config worker -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - masterly

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://masterly-air-academy.dz}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - masterly

  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: masterly
      POSTGRES_USER: masterly
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in .env (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterly -d masterly"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - masterly

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - set it in .env (see .env.example)}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required - set it in .env (see .env.example)}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - masterly

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required - set it in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required - set it in .env (see .env.example)}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - masterly

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required - set it in .env (see .env.example)}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required - set it in .env (see .env.example)}
      MINIO_BUCKET: masterly-documents
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"; do sleep 2; done
        mc mb -p "local/$${MINIO_BUCKET}" || true
        mc anonymous set none "local/$${MINIO_BUCKET}" || true
    restart: "no"
    networks:
      - masterly

  meilisearch:
    image: getmeili/meilisearch:v1.13.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:?MEILI_KEY is required - set it in .env (see .env.example)}
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    networks:
      - masterly

  backup:
    image: postgres:17.10-alpine
    command: |
      sh -c 'while true; do
        pg_dump -h db -U masterly -d masterly | gzip > /backups/backup_$$(date +%Y%m%d_%H%M).sql.gz;
        find /backups -name "*.sql.gz" -mtime +30 -delete;
        sleep 86400;
      done'
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in .env (see .env.example)}
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - masterly
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mailserver:
    image: docker.io/mailserver/docker-mailserver:15.1.0
    hostname: masterly-air-academy.dz
    env_file: ./mailserver.env
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker-data/mail/mail-data:/var/mail
      - ./docker-data/mail/mail-logs:/var/log/mail
      - ./docker-data/mail/config:/tmp/docker-mailserver
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - masterly

  roundcube:
    image: roundcube/roundcubemail:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - masterly
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_SMTP_SERVER: mailserver
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
    volumes:
      - ./docker-data/roundcube:/var/roundcube
      - ./docker-data/roundcube/config/custom.inc.php:/usr/src/roundcubemail/config/custom.inc.php:ro
      - ./docker-data/roundcube/skins/elastic/custom.css:/usr/src/roundcubemail/skins/elastic/custom.css:ro
    depends_on:
      - mailserver
    restart: unless-stopped

  maildb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postfixadmin
      POSTGRES_USER: postfixadmin
      POSTGRES_PASSWORD: ${MAILDB_PASSWORD:?MAILDB_PASSWORD is required}
    volumes:
      - maildb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postfixadmin -d postfixadmin"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - masterly

  postfixadmin:
    image: postfixadmin:apache
    ports:
      - "127.0.0.1:8091:80"
    environment:
      POSTFIXADMIN_DB_TYPE: pgsql
      POSTFIXADMIN_DB_HOST: maildb
      POSTFIXADMIN_DB_PORT: 5432
      POSTFIXADMIN_DB_USER: postfixadmin
      POSTFIXADMIN_DB_PASSWORD: ${MAILDB_PASSWORD:?MAILDB_PASSWORD is required}
      POSTFIXADMIN_DB_NAME: postfixadmin
      POSTFIXADMIN_SMTP_SERVER: mailserver
      POSTFIXADMIN_SMTP_PORT: 25
      POSTFIXADMIN_ENCRYPT: sha512
      POSTFIXADMIN_SETUP_PASSWORD: ${POSTFIXADMIN_SETUP_HASH:?POSTFIXADMIN_SETUP_HASH is required}
    volumes:
      - ./docker-data/postfixadmin:/var/www/html
    depends_on:
      maildb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - masterly

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meilisearch_data:
  backup_data:
  media_data:
  maildb_data:

networks:
  masterly:
    driver: bridge

; Production-style PHP settings for Postfixadmin.
; The app isn't fully PHP 8.3-clean (e.g. deprecated gmstrftime() on the
; viewlog page); echoing deprecations breaks header()/redirects. Log errors
; to the Apache error log instead of printing them to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

expose_php = Off

session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

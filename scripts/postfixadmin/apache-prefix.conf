# Serve Postfixadmin under the /postfixadmin/ path (proxied via nginx
# from https://mail.masterly-air-academy.dz/postfixadmin/).
Alias /postfixadmin /var/www/html/public

<Directory /var/www/html/public>
    AllowOverride All
    Require all granted
</Directory>

# Let Postfixadmin know the request arrived over HTTPS (nginx forwards it).
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
